name: Generate Multi-Repo Sitemap
on:
  push:
    branches: [master]
    paths-ignore:
      - 'sitemap.xml'
      - 'robots.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1,4'

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate sitemap and robots.txt
        run: |
          cat > sitemap.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          EOF
          
          echo "  <url>" >> sitemap.xml
          echo "    <loc>https://jimit105.github.io/</loc>" >> sitemap.xml
          echo "    <lastmod>$(date -u +%Y-%m-%dT%H:%M:%S+00:00)</lastmod>" >> sitemap.xml
          echo "    <changefreq>weekly</changefreq>" >> sitemap.xml
          echo "    <priority>1.0</priority>" >> sitemap.xml
          echo "  </url>" >> sitemap.xml
          
          echo "Discovering repos with GitHub Pages enabled..."
          curl -s "https://api.github.com/users/jimit105/repos?per_page=100" | \
          jq -r '.[] | select(.has_pages == true) | "\(.name)|\(.pushed_at)"' | \
          while IFS='|' read repo lastmod; do
            echo "Processing repo: $repo"
            curl -s "https://api.github.com/repos/jimit105/$repo/contents" | \
            jq -r '.[] | select(.name | endswith(".html") or endswith(".md")) | select(.name | ascii_downcase | startswith("readme") | not) | .name' | \
            while read file; do
              if [[ $file == *.html ]]; then
                url="$repo/$file"
              else
                url="$repo/${file%.md}.html"
              fi
              echo "  - Added: $url"
              echo "  <url>" >> sitemap.xml
              echo "    <loc>https://jimit105.github.io/$url</loc>" >> sitemap.xml
              echo "    <lastmod>$lastmod</lastmod>" >> sitemap.xml
              echo "    <changefreq>monthly</changefreq>" >> sitemap.xml
              echo "    <priority>0.8</priority>" >> sitemap.xml
              echo "  </url>" >> sitemap.xml
            done
          done
          
          echo "</urlset>" >> sitemap.xml
          echo "Sitemap generation complete!"
          
          cat > robots.txt << 'EOF'
          User-agent: *
          Allow: /
          
          Sitemap: https://jimit105.github.io/sitemap.xml
          EOF
      
      - name: Commit files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sitemap.xml robots.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update sitemap and robots.txt [skip ci]"
          git push

